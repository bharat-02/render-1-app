<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-card {
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            background: #ffffff;
            padding: 2.5rem;
            max-width: 580px;
            text-align: center;
        }
        .btn-custom {
            background-color: #0d6efd;
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem 1.75rem;
            border-radius: 8px;
            transition: background-color 0.2s ease-in-out;
            text-decoration: none;
            display: inline-block;
        }
        .btn-custom:hover {
            background-color: #0b5ed7;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="hero-card">
        <h1 class="h3 fw-bold text-primary mb-3">
            Welcome to the Student Exam Performance Predictor
        </h1>
        <p class="text-muted mb-4">
            Predict student mathematics scores based on demographic and academic performance metrics.
        </p>
        <a href="{{ url_for('predict_datapoint') }}" class="btn btn-custom btn-lg">
            Go to Prediction Page
        </a>
    </div>
</body>
</html>
